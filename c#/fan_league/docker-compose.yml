services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fan-league-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Kestrel__Endpoints__Http__Url: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fan_league;Username=fan_league;Password=fan_league_dev
      NbaApi__ApiKey: ${NBA_API_KEY}
    ports:
      - "5160:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fan-league-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fan_league
      POSTGRES_USER: fan_league
      POSTGRES_PASSWORD: fan_league_dev
    ports:
      - "5432:5432"
    volumes:
      - fan_league_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fan_league -d fan_league"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fan_league_postgres_data:
